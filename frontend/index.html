```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <nav class="top-menu">
        <a href="#" class="menu-item active">계획생성</a>
        <a href="#" class="menu-item">계획조회</a>
        <a href="#" class="menu-item">마이페이지</a>
    </nav>


    <div class="card">

        <div class="card-title">
            📅 오늘의 할 일
        </div>

        <p>
            완료한 할 일 :
            <strong id="completedCount">0</strong> / 4
        </p>


        <label class="task">

            <input type="checkbox" class="task-check">

            <div class="task-info">
                <div class="task-name">
                    자료구조 과제
                </div>

                <div class="task-time">
                    10:00 ~ 11:00
                </div>
            </div>

        </label>


        <label class="task">

            <input type="checkbox" class="task-check">

            <div class="task-info">
                <div class="task-name">
                    영어단어 50개
                </div>

                <div class="task-time">
                    11:30 ~ 12:00
                </div>
            </div>

        </label>


        <label class="task">

            <input type="checkbox" class="task-check">

            <div class="task-info">
                <div class="task-name">
                    전공공부
                </div>

                <div class="task-time">
                    14:00 ~ 15:00
                </div>
            </div>

        </label>


        <label class="task">

            <input type="checkbox" class="task-check">

            <div class="task-info">
                <div class="task-name">
                    운동하기
                </div>

                <div class="task-time">
                    18:00 ~ 19:00
                </div>
            </div>

        </label>


        <button class="start-btn" id="startStudyBtn">
            ▶ 공부 시작하기
        </button>

    </div>


    <div class="card">

        <div class="card-title">
            🌱 나의 캐릭터
        </div>

        <div class="character">

            <div class="character-img">
                캐릭터 이미지
            </div>

            <div class="character-info">

                <div class="level">
                    Lv. 7 햇병아리
                </div>

                <div class="exp-text">
                    <span>EXP</span>
                    <span>80 / 120</span>
                </div>

                <div class="exp-bar">
                    <div class="exp-progress"></div>
                </div>

                <div class="next-level">
                    ⭐ 다음 레벨까지 40 EXP
                </div>

            </div>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
```
