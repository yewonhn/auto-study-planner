<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <!-- 상단 메뉴 -->
    <nav class="top-menu">
        <a href="#" class="menu-item active">계획생성</a>
        <a href="#" class="menu-item">계획조회</a>
        <a href="#" class="menu-item">마이페이지</a>
    </nav>

    <!-- 오늘의 할 일 카드 -->
    <div class="card">

        <div class="card-title">
            📅 오늘의 할 일
        </div>

        <p>
            완료한 할 일 : 
            <strong id="completedCount">0</strong> / <span id="totalCount">0</span>
        </p>

        <!-- JS에서 API 데이터를 받아 동적으로 태그가 생성되는 영역 -->
        <div id="taskList"></div>

        <button class="start-btn" id="startStudyBtn">
            ▶ 공부 시작하기
        </button>

    </div>

    <!-- 나의 캐릭터 카드 -->
    <div class="card">

        <div class="card-title">
            🌱 나의 캐릭터
        </div>

        <div class="character">

            <div class="character-img" id="characterImg">
                캐릭터 이미지
            </div>

            <div class="character-info">

                <div class="level" id="userLevel">
                    Lv. 7 햇병아리
                </div>

                <div class="exp-text">
                    <span>EXP</span>
                    <span><span id="currentExp">80</span> / <span id="maxExp">120</span></span>
                </div>

                <div class="exp-bar">
                    <div class="exp-progress" id="expProgressBar" style="width: 66.6%;"></div>
                </div>

                <div class="next-level" id="nextLevelText">
                    ⭐ 다음 레벨까지 40 EXP
                </div>

            </div>

        </div>

    </div>

</div>

<!-- API 연동 Script -->
<script src="script.js"></script>

</body>
</html>
